name: tellybase_mobile
description: Premium native Android client for TellyBase private cloud storage.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

# Versions are intentionally pinned to keep CI and release builds reproducible.
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8
  dio: 5.11.0
  file_picker: 11.0.3
  flutter_riverpod: 2.6.1
  flutter_secure_storage: 10.3.1
  intl: 0.20.3
  mime: 2.0.0
  open_filex: 4.7.0
  path_provider: 2.1.6
  shared_preferences: 2.5.5
  video_player: 2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
