name: tellybase
description: >
  TellyBase — an Apple-inspired personal cloud that uses your own Telegram
  account as unlimited, encrypted, serverless storage.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ---- State management ----
  flutter_riverpod: ^2.5.1

  # ---- Telegram MTProto (pure Dart, no native binaries / no bot API) ----
  # `t`  -> generated TL schema (types + serialization)
  # `tg` -> MTProto transport/auth/session implementation on top of `t`
  t: ">=218.0.0 <300.0.0"
  tg: ^0.0.20

  # ---- Local encrypted index (device-local database, never leaves device) ----
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4

  # ---- Cryptography (AES-256-GCM chunk/metadata encryption, checksums) ----
  cryptography: ^2.7.0
  crypto: ^3.0.5
  flutter_secure_storage: ^9.2.2

  # ---- File system / media access ----
  file_picker: ^8.1.2
  mime: ^1.0.6

  # ---- Background work / connectivity / lifecycle ----
  workmanager: ^0.5.2
  connectivity_plus: ^6.0.5

  # ---- UX niceties ----
  share_plus: ^9.0.0
  intl: ^0.19.0
  collection: ^1.18.0
  uuid: ^4.4.2
  shared_preferences: ^2.3.2

  # ---- Not yet wired into lib/, kept out of the default build on purpose ----
  # Re-add these once the corresponding feature actually uses them, since a
  # couple (notably flutter_local_notifications) require extra manual Gradle
  # config (Java core library desugaring) that a stock `flutter create .`
  # project doesn't have out of the box:
  #   photo_manager, permission_handler, image, video_player,
  #   cached_network_image, shimmer, flutter_local_notifications, rxdart

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/lottie/
