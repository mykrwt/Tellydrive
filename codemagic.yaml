workflows:
  android-build:
    name: Android APK Build
    max_build_duration: 60
    # Individual free plan minutes apply to macOS M2 builds.
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      java: 17

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper

    scripts:
      - name: Show tool versions
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties
          cat android/local.properties

      - name: Verify Telegram API credentials
        script: |
          set -eu
          test -n "${TELEGRAM_API_ID:-}" || { echo "Missing TELEGRAM_API_ID in the tellybase_secrets group."; exit 1; }
          test -n "${TELEGRAM_API_HASH:-}" || { echo "Missing TELEGRAM_API_HASH in the tellybase_secrets group."; exit 1; }
          case "$TELEGRAM_API_ID" in
            *[!0-9]*|'') echo "TELEGRAM_API_ID must contain digits only."; exit 1 ;;
          esac
          test "${#TELEGRAM_API_HASH}" -eq 32 || { echo "TELEGRAM_API_HASH must be exactly 32 characters."; exit 1; }
          case "$TELEGRAM_API_HASH" in
            *[!0123456789abcdefABCDEF]*) echo "TELEGRAM_API_HASH must be hexadecimal."; exit 1 ;;
          esac

      - name: Build release APK
        script: |
          flutter build apk --release --target=lib/main.dart \
            --dart-define=TELEGRAM_API_ID="$TELEGRAM_API_ID" \
            --dart-define=TELEGRAM_API_HASH="$TELEGRAM_API_HASH"

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/apk/**/*.apk
