workflows:
  tellybase-android:
    name: TellyBase Release

    environment:
      flutter: stable
      groups:
        - tellybase_secrets

    scripts:
      - flutter pub get

      - flutter build apk --release \
          --dart-define=TELEGRAM_API_ID=$TELEGRAM_API_ID \
          --dart-define=TELEGRAM_API_HASH=$TELEGRAM_API_HASH

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
